<article>
    <a class="column" href="{{ .Params.website }}" target="_blank" title="{{ .Title }}">
        {{ with .Resources.Get .Params.image }}
        {{ partial "partner-logo.html" (dict "img" . "title" $.Title) }}
        {{ end }}
        <span class="partner-name">{{ $.Title }}</span>
    </a>
</article>
