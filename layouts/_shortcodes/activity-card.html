{{ $source := .Page.Resources.Get (printf "%s.webp" (.Get 0)) }}
{{ $image := $source.Resize (printf "%dx%d q80 webp" $source.Width $source.Height) }}
<img src="{{ $image.RelPermalink }}" width="{{ $image.Width }}" height="{{ $image.Height }}" alt="" loading="lazy"/>
<div class="icon">
    {{- partial "inline-svg" (printf "icons/%s" (.Get 1)) -}}
</div>
<div class="content">
    {{ .Inner | .Page.RenderString }}
</div>
